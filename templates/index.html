<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหารูปภาพกิจกรรมด้วยใบหน้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen relative flex flex-col justify-between">

    <!-- 🍔 NAVBAR & ปุ่ม 3 ขีด มุมขวาบน -->
    <nav class="flex justify-between items-center px-6 py-4 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40">
        <div class="text-xl font-bold text-indigo-400 flex items-center gap-2">
            📸 Event Photo Finder
        </div>
        
        <!-- ปุ่ม 3 ขีดสำหรับ Admin -->
        <button id="menuBtn" class="text-slate-300 hover:text-white text-2xl focus:outline-none p-2 rounded-lg hover:bg-slate-700 transition" title="สำหรับผู้ดูแลระบบ">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- 🔒 MODAL กรอกรหัสผ่านสำหรับ ADMIN (จะแสดงเมื่อกดปุ่ม 3 ขีด) -->
    <div id="adminModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-md shadow-2xl relative">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <h3 class="text-xl font-bold text-indigo-400 mb-2 flex items-center gap-2">
                🔒 เข้าสู่ระบบแอดมิน
            </h3>
            <p class="text-slate-400 text-sm mb-4">กรุณากรอกรหัสผ่านเพื่อเข้าสู่หน้าจัดการอัปโหลดรูปภาพ</p>

            <form id="adminAuthForm" class="space-y-4">
                <div>
                    <input type="password" id="adminPassword" placeholder="กรอกรหัสผ่านแอดมิน..." required
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition">
                    ยืนยันตัวตน
                </button>
            </form>
            <div id="authError" class="text-red-400 text-sm text-center mt-3 hidden"></div>
        </div>
    </div>

    <!-- 📸 MAIN CONTENT: หน้าบ้านสำหรับคนทั่วไปสแกนหน้าค้นหารูป -->
    <main class="max-w-4xl mx-auto p-6 text-center my-auto w-full">
        <h1 class="text-3xl sm:text-4xl font-bold text-indigo-400 mb-2">🔍 ค้นหารูปภาพด้วยใบหน้า</h1>
        <p class="text-slate-400 mb-8 text-sm sm:text-base">ถ่ายภาพ หรืออัปโหลดรูปถ่ายใบหน้าของคุณ เพื่อค้นหารูปกิจกรรมทั้งหมดที่มีคุณอยู่ในนั้น</p>

        <!-- กล่องเลือกสแกน / อัปโหลดรูปหน้า -->
        <div class="bg-slate-800 border border-slate-700 p-6 sm:p-8 rounded-2xl shadow-xl max-w-xl mx-auto space-y-6">
            
            <div class="flex justify-center gap-4">
                <label class="w-full cursor-pointer bg-slate-900 hover:bg-slate-700/50 border-2 border-dashed border-indigo-500/50 p-6 rounded-xl flex flex-col items-center gap-3 transition">
                    <i class="fa-solid fa-camera text-4xl text-indigo-400"></i>
                    <span class="text-sm font-medium text-slate-300">ถ่ายรูป หรือ อัปโหลดรูปใบหน้าของคุณ</span>
                    <input type="file" id="faceInput" accept="image/*" capture="user" class="hidden">
                </label>
            </div>

            <!-- Preview ใบหน้าที่อัปโหลด -->
            <div id="previewContainer" class="hidden">
                <p class="text-xs text-slate-400 mb-2">รูปใบหน้าที่ใช้อ้างอิง:</p>
                <img id="facePreview" class="w-32 h-32 object-cover rounded-full mx-auto border-4 border-indigo-500 shadow-lg">
            </div>

            <button id="btnSearchFace" disabled class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold rounded-xl transition shadow-lg">
                เริ่มสแกนค้นหาใบหน้า
            </button>
        </div>

        <!-- แสดงข้อความสถานะ / ผลลัพธ์ -->
        <div id="statusMessage" class="mt-6 text-sm font-medium hidden"></div>
        <div id="searchResults" class="mt-8 text-left grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    </main>

    <footer class="text-center py-4 text-xs text-slate-500">
        School Event Photo Finder System
    </footer>

    <!-- JAVASCRIPT ควบคุมการทำงาน -->
    <script>
    // 1. ระบบ Modal แอดมิน (ปุ่ม 3 ขีด)
    const menuBtn = document.getElementById('menuBtn');
    const adminModal = document.getElementById('adminModal');
    const closeModal = document.getElementById('closeModal');
    const adminAuthForm = document.getElementById('adminAuthForm');
    const authError = document.getElementById('authError');

    menuBtn.addEventListener('click', () => adminModal.classList.remove('hidden'));
    closeModal.addEventListener('click', () => adminModal.classList.add('hidden'));

    // ตั้งรหัสผ่านแอดมินตรงนี้ (ตัวอย่างรหัส: admin1234)
    adminAuthForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const pwd = document.getElementById('adminPassword').value;
        
        if (pwd === 'admin1234') { 
            window.location.href = '/admin'; // ใส่รหัสถูก ไปหน้าอัปโหลด
        } else {
            authError.classList.remove('hidden');
            authError.innerText = '❌ รหัสผ่านไม่ถูกต้อง!';
        }
    });

    // 2. พรีวิวรูปใบหน้าที่ถ่าย/อัปโหลด
    const faceInput = document.getElementById('faceInput');
    const facePreview = document.getElementById('facePreview');
    const previewContainer = document.getElementById('previewContainer');
    const btnSearchFace = document.getElementById('btnSearchFace');

    faceInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                facePreview.src = e.target.result;
                previewContainer.classList.remove('hidden');
                btnSearchFace.disabled = false;
            }
            reader.readAsDataURL(file);
        }
    });
    </script>
</body>
</html>
