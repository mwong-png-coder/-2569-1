<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการรูปภาพกิจกรรม (Admin)</title>
    <!-- ใช้ Tailwind CSS แต่งหน้าตาให้สวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-indigo-400 flex items-center gap-2">
            📤 อัปโหลดรูปภาพกิจกรรม
        </h2>
        <p class="text-slate-400 text-sm mb-6">รูปภาพจะถูกนำไปสร้างโฟลเดอร์แยกตามชื่องานใน Google Drive อัตโนมัติ</p>

        <form id="uploadForm" class="space-y-5">
            <!-- 1. ช่องกรอกชื่องาน -->
            <div>
                <label for="event_name" class="block text-sm font-medium text-slate-300 mb-1">ชื่องานกิจกรรม / อัลบั้ม:</label>
                <input type="text" id="event_name" name="event_name" placeholder="เช่น กีฬาสีประจำปี 2569" required
                    class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- 2. ช่องเลือกรูปภาพหลายรูป -->
            <div>
                <label for="photos" class="block text-sm font-medium text-slate-300 mb-1">เลือกรูปภาพ:</label>
                <input type="file" id="photos" name="photos" accept="image/*" multiple required
                    class="w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer bg-slate-900 rounded-lg border border-slate-700">
            </div>

            <!-- 3. ปุ่มกดส่งข้อมูล -->
            <button type="submit" id="btnSubmit" 
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg transition duration-200 shadow-lg disabled:bg-slate-600">
                เริ่มอัปโหลดลง Google Drive
            </button>
        </form>

        <!-- แสดงข้อความสถานะ -->
        <div id="statusMessage" class="mt-4 text-center font-medium text-sm hidden p-3 rounded-lg"></div>
    </div>

    <!-- JavaScript สำหรับส่งข้อมูลไปหา Flask -->
    <script>
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const statusMsg = document.getElementById('statusMessage');
        const btnSubmit = document.getElementById('btnSubmit');
        const formData = new FormData(this);
        
        // แสดงสถานะกำลังทำงาน
        statusMsg.classList.remove('hidden', 'bg-red-900/50', 'text-red-300', 'bg-green-900/50', 'text-green-300');
        statusMsg.classList.add('bg-blue-900/50', 'text-blue-300');
        statusMsg.innerHTML = '⏳ กำลังสร้างโฟลเดอร์และอัปโหลดรูปภาพลง Google Drive กรุณารอสักครู่...';
        btnSubmit.disabled = true;

        try {
            const response = await fetch('/admin/upload-event', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            
            if (result.success) {
                statusMsg.classList.remove('bg-blue-900/50', 'text-blue-300');
                statusMsg.classList.add('bg-green-900/50', 'text-green-300');
                statusMsg.innerHTML = '✅ ' + result.message;
                this.reset();
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            statusMsg.classList.remove('bg-blue-900/50', 'text-blue-300');
            statusMsg.classList.add('bg-red-900/50', 'text-red-300');
            statusMsg.innerHTML = '❌ เกิดข้อผิดพลาด: ' + (error.message || 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
        } finally {
            btnSubmit.disabled = false;
        }
    });
    </script>
</body>
</html>
