<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบซิงค์อัลบั้มรูปภาพกิจกรรม (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">

    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-lg">
        <h2 class="text-2xl font-bold text-indigo-400 mb-2 flex items-center gap-2">
            🔗 ซิงค์อัลบั้มรูปภาพจาก Google Drive
        </h2>
        <p class="text-slate-400 text-sm mb-6">
            อัปโหลดรูปภาพทั้งหมดลงในโฟลเดอร์ Google Drive โรงเรียน แล้วนำ <b>ลิงก์โฟลเดอร์ (URL)</b> มาวางที่นี่
        </p>

        <form id="syncForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">https://drive.google.com/drive/folders/1_HrJYb5WqJroQlQdL4va7pOaSoYWhr-F?usp=sharing</label>
                <input type="url" id="folderUrl" placeholder="https://drive.google.com/drive/folders/1abc..." required
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <button type="submit" id="btnSync" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> ตรวจสอบและซิงค์รูปภาพเข้าระบบ
            </button>
        </form>

        <div id="statusMessage" class="mt-6 p-4 rounded-xl text-sm font-medium hidden"></div>
    </div>

    <script>
    document.getElementById('syncForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const folderUrl = document.getElementById('folderUrl').value;
        const statusMsg = document.getElementById('statusMessage');
        const btnSync = document.getElementById('btnSync');

        statusMsg.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-indigo-950/50 text-indigo-300 border border-indigo-800 block';
        statusMsg.innerText = '⏳ กำลังเชื่อมต่อ Google Drive เพื่อตรวจสอบรูปภาพ...';
        btnSync.disabled = true;

        try {
            const response = await fetch('/admin/sync-folder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ folder_url: folderUrl })
            });

            const result = await response.json();

            if (result.success) {
                statusMsg.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-emerald-950/50 text-emerald-400 border border-emerald-800 block';
                statusMsg.innerText = '✅ ' + result.message;
                document.getElementById('folderUrl').value = '';
            } else {
                throw new Error(result.message);
            }
        } catch (error) {
            statusMsg.className = 'mt-6 p-4 rounded-xl text-sm font-medium bg-rose-950/50 text-rose-400 border border-rose-800 block';
            statusMsg.innerText = '❌ เกิดข้อผิดพลาด: ' + error.message;
        } finally {
            btnSync.disabled = false;
        }
    });
    </script>
</body>
</html>
